name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --upgrade setuptools
          pip install -e ".[dev,demo]"
      
      - name: Lint with ruff
        run: |
          ruff check src tests demo.py scripts

      - name: Check formatting with ruff
        run: |
          ruff format --check src tests demo.py scripts
      
      - name: Type check with mypy
        run: |
          mypy src demo.py scripts
      
      - name: Run tests
        run: |
          pytest

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --upgrade setuptools
          pip install -e . bandit pip-audit

      - name: Run bandit
        run: |
          bandit -r src demo.py scripts -q

      - name: Scan git history with gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --log-opts="--all" --redact --no-banner .

      - name: Run pip-audit
        run: |
          pip-audit --skip-editable

  test-macos:
    # macOS runners are slow to start, so this job only runs on demand and for release tags.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0
          pip install --upgrade setuptools
          pip install -e ".[dev,demo]"

      - name: Run tests
        run: |
          pytest
